# Copy to .github/workflows/publish-docs.yml in a Hugo site's repository.
# Set SITE_URL to the site's main address and dest (bottom) to its name in DOCS_SITES on the host; the
# site is live there about five minutes after a push to main.
name: publish-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: '0.168.0'   # pin to the version your site is tested with
      SITE_URL: https://guide.example.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tgz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/hugo.sums" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz\$" hugo.sums \
            | sed 's/ hugo_extended.*/ hugo.tgz/' | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/hugo.tgz" -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" --minify --baseURL "$SITE_URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public/
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: ci-publish
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public
      - uses: mlaify/ci-publish/.github/actions/publish@<SHA>
        with:
          channel: docs
          source: public
          dest: guide   # the site's name in DOCS_SITES
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          PUBLISH_KNOWN_HOSTS: ${{ secrets.PUBLISH_KNOWN_HOSTS }}
          PUBLISH_HOST: ${{ secrets.PUBLISH_HOST }}
          PUBLISH_USER: ${{ secrets.PUBLISH_USER }}

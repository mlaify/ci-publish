# What packages.yml publishes to the package site. It is the only publisher of each index, so publishes
# never race: it collects the files attached to each repository's GitHub releases (checked against
# GitHub's SHA-256), adds the ones the live index doesn't have yet, and publishes the merged index.
# Drafts and pre-releases are skipped. Release a project as usual and it appears within six hours.

[pypi]
# The index URL comes from the PKG_URL repository variable (<PKG_URL>/pypi).

[[pypi.repo]]
repo = "mlaify/AttackMap"
assets = ['^attackmap-[0-9][^/]*-py3-none-any\.whl$', '^attackmap-[0-9][^/]*\.tar\.gz$']

# The AttackMap analyzers. Wheel and sdist names use underscores (attackmap_analyzer_go-0.2.0-...).

[[pypi.repo]]
repo = "mlaify/attackmap-analyzer-atproto"

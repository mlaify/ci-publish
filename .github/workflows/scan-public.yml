# Nightly: Trivy + Semgrep over every public, non-archived repository of this organization whose
# default branch has moved since its last published report. Reports go to the reports site.
# (This repository reports on itself through security-reports.yml.)
name: scan-public

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: Rescan every public repository, changed or not
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scan-public
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-24.04
    environment: ci-publish
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SELF: ${{ github.event.repository.name }}
          ALL: ${{ inputs.all }}
          REPORTS_URL: ${{ secrets.REPORTS_URL }}
          REPORTS_AUTH: ${{ secrets.REPORTS_AUTH }}
        run: |
          # Without the reports login every public repository is rescanned (free here, just slower).
          [ -n "$REPORTS_URL" ] && [ -n "$REPORTS_AUTH" ] || echo "::warning::REPORTS_URL/REPORTS_AUTH unset: rescanning all"
          gh api --paginate "orgs/$OWNER/repos?type=public&per_page=100" \
            --jq '.[] | select((.archived | not) and .size > 0) | "\(.name) \(.default_branch)"' |
            sort >"$RUNNER_TEMP/public"
          : >"$RUNNER_TEMP/scan"
          while read -r name branch; do
            [ "$name" != "$SELF" ] || continue
            head=$(gh api "repos/$OWNER/$name/commits/$branch" --jq .sha)
            reported=""
            if [ -n "$REPORTS_URL" ] && [ -n "$REPORTS_AUTH" ]; then
              reported=$(curl -fsS -u "$REPORTS_AUTH" "${REPORTS_URL%/}/$name/latest/meta.json" 2>/dev/null | jq -r .sha || true)
            fi
            if [ "$ALL" = true ] || [ "$head" != "$reported" ]; then echo "$name" >>"$RUNNER_TEMP/scan"; fi
          done <"$RUNNER_TEMP/public"
          echo "$(wc -l <"$RUNNER_TEMP/scan") of $(wc -l <"$RUNNER_TEMP/public") public repositories to scan:"
          sed 's/^/  /' "$RUNNER_TEMP/scan"
          echo "repos=$(jq -R . "$RUNNER_TEMP/scan" | jq -cs .)" >>"$GITHUB_OUTPUT"

  # The scan legs run third-party tools over other repositories' code, so they get no secrets; the
  # publish legs get the publishing key and see only the finished report.
  scan:
    needs: list
    if: needs.list.outputs.repos != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ci-publish
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          persist-credentials: false
          path: target
      - id: rev
        run: |
          echo "sha=$(git -C target rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "ref=$(git -C target rev-parse --abbrev-ref HEAD)" >>"$GITHUB_OUTPUT"
      - id: scan
        uses: ./ci-publish/.github/actions/security-scan
        with:
          path: target
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          sha: ${{ steps.rev.outputs.sha }}
          ref: ${{ steps.rev.outputs.ref }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.repo }}
          path: ${{ steps.scan.outputs.dir }}
          retention-days: 1

  publish:
    needs: [list, scan]
    if: ${{ !cancelled() && needs.list.outputs.repos != '[]' }}
    runs-on: ubuntu-24.04
    environment: ci-publish
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: get
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-${{ matrix.repo }}
          path: ${{ runner.temp }}/report
      - id: meta
        if: steps.get.outcome == 'success'
        run: echo "sha=$(jq -r .sha "$RUNNER_TEMP/report/meta.json")" >>"$GITHUB_OUTPUT"
      - if: steps.get.outcome == 'success'
        uses: ./.github/actions/publish
        with:
          channel: reports
          source: ${{ runner.temp }}/report
          dest: ${{ matrix.repo }}/${{ steps.meta.outputs.sha }}
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          PUBLISH_KNOWN_HOSTS: ${{ secrets.PUBLISH_KNOWN_HOSTS }}
          PUBLISH_HOST: ${{ secrets.PUBLISH_HOST }}
          PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
      - if: steps.get.outcome != 'success'
        env:
          REPO: ${{ matrix.repo }}
        run: echo "::warning::no report for $REPO (its scan failed)"
